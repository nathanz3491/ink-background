<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ink-background example</title>
    <style>
      :root { --paper: #faf6ef; --ink: #a05e1c; color-scheme: light; }
      :root.dark { --paper: #1b1410; --ink: #dca75f; color-scheme: dark; }
      body { margin: 0; min-height: 100vh; font: 16px/1.5 system-ui, sans-serif; background: var(--paper); }
      #ink { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }
      main { max-width: 32rem; margin: 30vh auto 0; padding: 0 16px; }
      button { font: inherit; }
      footer { position: fixed; bottom: 12px; right: 16px; font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="ink" aria-hidden="true"></canvas>
    <main>
      <h1>ink-background</h1>
      <p>
        <button id="presence">Presence: calm</button>
        <button id="theme">Dark theme</button>
      </p>
    </main>
    <footer>Background by <a href="https://nathanz.cloud">nathanz.cloud</a></footer>
    <script type="module">
      import { createInk, PALETTES } from "../dist/index.js";

      // paper and body follow the page's own tokens; the rest come from the palette.
      const palette = () => (document.documentElement.classList.contains("dark") ? PALETTES.dark : PALETTES.light);
      const ink = createInk(document.getElementById("ink"), {
        colors: { ...palette(), paper: "var(--paper)", body: "var(--ink)" },
      });

      let presence = "calm";
      document.getElementById("presence").onclick = (e) => {
        presence = presence === "calm" ? "full" : "calm";
        ink.setPresence(presence);
        e.target.textContent = `Presence: ${presence}`;
      };
      document.getElementById("theme").onclick = (e) => {
        const dark = document.documentElement.classList.toggle("dark");
        ink.setColors({ ...palette(), paper: "var(--paper)", body: "var(--ink)" });
        e.target.textContent = dark ? "Light theme" : "Dark theme";
      };
    </script>
  </body>
</html>
